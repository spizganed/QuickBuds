[package]
name = "quickbuds-egui"
version = "5.4.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "QuickBuds for Windows and Linux, egui port"

[dependencies]
buds-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "system_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
serde_json = "1"
resvg = "0.48"
sys-locale = "0.3"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
] }

[target.'cfg(not(windows))'.dependencies]
# Linux tray icons need GTK running on their own thread (already a dependency of tray-icon there).
gtk = "0.18"
dbus = "0.9"
libc = "0.2"

[build-dependencies]
resvg = { version = "0.48", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
