[package]
name = "quickbuds"
version = "4.1.0-beta"
edition = "2021"
license = "GPL-3.0-only"
description = "QuickBuds for Windows and Linux"

[dependencies]
slint = { version = "1.18", features = ["unstable-winit-030"] }
tray-icon = "0.26"
serde_json = "1"
resvg = "0.48"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_System_SystemInformation",
] }

# Linux tray icons need GTK running on their own thread (already a dependency of tray-icon there).
[target.'cfg(not(windows))'.dependencies]
gtk = "0.18"
# BlueZ: paired devices over D-Bus (blocking), RFCOMM and SDP over kernel sockets.
dbus = "0.9"
libc = "0.2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
