name: Bug
description: Something in the app is wrong, on supported earbuds.
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: Earbuds model
      description: OnePlus, OPPO or realme, as in the README's Supported earbuds list.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuickBuds version and platform
      description: For example "4.10.0, Pixel 8, Android 16" or "4.10.0, Windows 11".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Prefer Settings › App › Feedback. That sends the log to the developer privately and
        removes Bluetooth addresses and device names. If you attach a log here, everyone can read it:
        remove the addresses and the names of your other devices first.
  - type: textarea
    id: snoop
    attributes:
      label: Snoop log
      description: >-
        A switch that does nothing on the buds needs a Bluetooth snoop log of HeyMelody or realme Link, with a
        screen recording. For a setting that QuickBuds lacks, use the Missing feature form instead. Steps:
        https://github.com/spizganed/QuickBuds/blob/main/docs/PACKET-CAPTURE.md#send-a-snoop-log-for-a-missing-feature
