name: Bug
description: Something in the app is wrong, on supported earbuds.
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: Earbuds model
      description: OnePlus, OPPO or realme, as in the README's Supported earbuds list.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuickBuds version and platform
      description: For example "4.10.0, Pixel 8, Android 16" or "4.10.0, Windows 11".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Dev tools › Clear, repeat the problem, then Dev tools › Export. The file lands in
        Download/QuickBuds/ (PC: Downloads/QuickBuds). Attach it here.
