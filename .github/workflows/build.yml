# Checks the locales, runs the Android unit tests and lint, builds the release APK and AAB, runs the core and desktop
# tests and builds the desktop files (scripts/desktop-dist.sh). Runs only by hand (`gh workflow run Build`, or the
# Actions tab), never on a push or a pull request. On the PC,
# scripts/release-build.sh builds the same release files, much faster (docs/CONTRIBUTING.md). The APK is signed
# when the repository has the RELEASE_KEYSTORE_B64 and RELEASE_KEY_PROPERTIES secrets, so it installs over the
# release app. The run's Artifacts hold every release file.
name: Build

# The run reads the repository only. The signing key arrives as a secret, so no write scope is needed.
permissions:
  contents: read

on:
  # Manual only: the developer starts a build from the Actions tab or with `gh workflow run`.
  workflow_dispatch:
    inputs:
      appimage_only:
        description: Build the Linux AppImage only (`gh workflow run Build -f appimage_only=true`)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ !inputs.appimage_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PROPS: ${{ secrets.RELEASE_KEY_PROPERTIES }}
        if: env.KEYSTORE != ''
        run: |
          mkdir -p local/keys
          echo "$KEYSTORE" | base64 -d > local/keys/quickbuds-release.jks
          printf '%s\n' "$PROPS" > local/keys/keystore.properties
      - name: Every string in all locales
        run: python3 scripts/check-locales.py
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - run: ./gradlew assembleRelease bundleRelease
      - name: Release names
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/QuickBuds$ver.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/QuickBuds$ver.aab"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android
          path: out/*
          retention-days: 14

  desktop:
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 (glibc 2.39): its WebKitGTK renders the transparent window cleanly. The 22.04 one ghosts.
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Packages
        run: |
          apt-get update -qq
          apt-get install -y -qq curl wget git zip python3 build-essential pkg-config file dpkg-dev patchelf xz-utils \
            clang lld llvm libssl-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-x11-0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --target x86_64-pc-windows-msvc
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install tauri-cli --version "^2" --locked
          cargo install cargo-xwin --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            desktop-tauri -> target
            core -> target
      - name: Test
        if: ${{ !inputs.appimage_only }}
        run: |
          cd core && cargo test
          cd ../desktop-tauri && cargo test
      - name: Archives
        env:
          QB_APPIMAGE_ONLY: ${{ inputs.appimage_only && '1' || '' }}
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop-tauri/Cargo.toml | head -1)
          QB_NATIVE=1 scripts/desktop-dist.sh "$ver"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop
          path: desktop-tauri/dist/*
          retention-days: 14

  checksums:
    # One SHA256SUMS for the whole release: the updater and the Linux installer verify against it.
    needs: [android, desktop]
    if: ${{ always() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: files
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checksums
          path: files/SHA256SUMS
          retention-days: 14
